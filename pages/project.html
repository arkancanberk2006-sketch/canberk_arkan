<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById('canvas-container');
        if (!container) return;

        // Sahne Ayarları
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / 400, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, 400);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- ÇİFT RENKLİ HAP OLUŞTURMA ---
        const group = new THREE.Group(); // İki parçayı bir arada tutmak için

        // 1. Parça (Mavi Üst)
        const geometry1 = new THREE.CapsuleGeometry(1.2, 1.25, 20, 30);
        const material1 = new THREE.MeshPhongMaterial({ color: 0x3498db, shininess: 100 });
        const pillTop = new THREE.Mesh(geometry1, material1);
        pillTop.position.y = 0.625; // Yukarı kaydır
        group.add(pillTop);

        // 2. Parça (Beyaz Alt)
        const geometry2 = new THREE.CapsuleGeometry(1.2, 1.25, 20, 30);
        const material2 = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 100 });
        const pillBottom = new THREE.Mesh(geometry2, material2);
        pillBottom.position.y = -0.625; // Aşağı kaydır
        group.add(pillBottom);

        group.rotation.z = Math.PI / 4;
        scene.add(group);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        camera.position.z = 6;

        // Kontroller
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enableZoom = false;

        // Boyutlandırma
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / 400;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, 400);
        });

        function animate() {
            requestAnimationFrame(animate);
            group.rotation.y += 0.005; // Hapı döndür
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    });
</script>
