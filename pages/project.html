<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const container = document.getElementById('canvas-container');
        if (!container) return;

        // Sahne Kurulumu
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / 400, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, 400);
        renderer.setPixelRatio(window.devicePixelRatio); // Net görüntü için
        container.appendChild(renderer.domElement);

        // Hap Modeli (Artık r160 ile CapsuleGeometry çalışacaktır)
        const geometry = new THREE.CapsuleGeometry(1.2, 2.5, 20, 30);
        const material = new THREE.MeshPhongMaterial({ 
            color: 0x3498db, 
            shininess: 100,
            specular: 0x444444
        });
        const pill = new THREE.Mesh(geometry, material);
        pill.rotation.z = Math.PI / 4;
        scene.add(pill);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);

        camera.position.z = 7;

        // Kontroller
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.enableZoom = false;

        // Pencere Boyutu Değiştiğinde Güncelleme
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            const newWidth = container.clientWidth;
            camera.aspect = newWidth / 400;
            camera.updateProjectionMatrix();
            renderer.setSize(newWidth, 400);
        }

        // Animasyon
        function animate() {
            requestAnimationFrame(animate);
            pill.rotation.y += 0.005;
            controls.update();
            renderer.render(scene, camera);
        }
        
        animate();
    });
</script>
